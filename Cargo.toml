[package]
name = "vynull-touch"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
description = "A native touchscreen companion for Vynull"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
rodio = { version = "=0.23.0", default-features = false, features = ["playback"] }
cpal = { version = "=0.18.2", default-features = false, features = ["pulseaudio"] }
rtrb = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
